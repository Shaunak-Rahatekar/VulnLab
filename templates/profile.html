{% extends "base.html" %}

{% block content %}
    <div class="card" style="max-width: 800px;">
        <h2>Account Settings</h2>
        
        <p><strong>Current Email:</strong> <span style="color: #28a745; font-weight: bold;">{{ current_email }}</span></p>
        
        <hr style="margin: 2rem 0; border: 0; border-top: 1px solid #eee;">
        
        <h3>Update Email</h3>
        <!-- The form action points to /change-email -->
        <form action="/change-email" method="POST">
            <div class="form-group">
                <label for="new_email">New Email Address:</label>
                <input type="email" id="new_email" name="new_email" required>
            </div>
            
            <!-- In patched mode, we include an unpredictable CSRF token -->
            {% if not vuln_mode %}
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% endif %}
            
            <button type="submit">Save Changes</button>
        </form>
    </div>


    <footer>
        <p>VulnLab — Educational Security Sandbox.</p>
        <p>Mode: <strong>{% if vuln_mode %}VULNERABLE{% else %}PATCHED{% endif %}</strong></p>
        <p><a href="/dashboard">Back to Dashboard</a></p>
    </footer>

{% endblock %}
